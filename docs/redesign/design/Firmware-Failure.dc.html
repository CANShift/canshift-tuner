<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Firmware update, failure</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        "
      >
        <header
          style="
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 56px;
            box-sizing: border-box;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2b2f35;
          "
        >
          <span
            style="
              display: inline-flex;
              align-items: center;
              gap: 8px;
              font-size: 15px;
              font-weight: 600;
            "
            ><span style="width: 8px; height: 8px; border-radius: 4px; background: #3dd68c"></span
            >Connected</span
          >
          <span
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              height: 44px;
              padding: 0 14px;
              border-radius: 22px;
              background: #16181b;
              border: 1px solid #2b2f35;
              font-size: 14px;
            "
            ><svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#3DD68C"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12l5 5L20 7"></path></svg
            >On the dash</span
          >
        </header>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 0;
            box-sizing: border-box;
            padding: 96px 24px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
          "
        >
          <div
            style="
              width: 72px;
              height: 72px;
              border-radius: 36px;
              background: #2a1c0a;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="38"
              height="38"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FF8800"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3l10 18H2z"></path>
              <path d="M12 10v5M12 18v.5"></path>
            </svg>
          </div>
          <h1 style="margin: 0; font-size: 30px; line-height: 1.15">Update didn’t install</h1>
          <div style="font-size: 16px; line-height: 1.5; color: #c9cdd2">
            The signature file doesn’t match the firmware file.
            <b style="color: #f2f3f5">Nothing was changed</b> — your dash still runs 2.4.1 and works
            as before.
          </div>

          <div
            style="
              background: #16181b;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              padding: 14px 16px;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          >
            <span style="font-size: 13px; color: #a0a6ad">What to do</span>
            <span style="font-size: 15px; line-height: 1.5"
              >Download both files again from the same release, then try again.</span
            >
          </div>

          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
            <button
              style="
                height: 52px;
                border-radius: 10px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 16px;
                font-weight: 600;
              "
            >
              Choose files again
            </button>
            <button
              style="
                height: 48px;
                border-radius: 10px;
                background: transparent;
                color: #f2f3f5;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 15px;
              "
            >
              Back to Dash
            </button>
          </div>
        </main>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>
