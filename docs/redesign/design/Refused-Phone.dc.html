<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dash refused the changes</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
          a {
            color: #ff6b6b;
          }
          a:hover {
            color: #ff8f8f;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        "
      >
        <header
          style="
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 56px;
            box-sizing: border-box;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2b2f35;
          "
        >
          <span
            style="
              display: inline-flex;
              align-items: center;
              gap: 8px;
              font-size: 15px;
              font-weight: 600;
            "
            ><span style="width: 8px; height: 8px; border-radius: 4px; background: #3dd68c"></span
            >Connected</span
          >
          <span
            style="
              display: inline-flex;
              align-items: center;
              gap: 8px;
              height: 44px;
              padding: 0 14px;
              border-radius: 22px;
              background: #16181b;
              border: 1px solid #2b2f35;
              font-size: 14px;
            "
            ><span style="width: 8px; height: 8px; border-radius: 4px; background: #ff8800"></span>3
            changes not sent</span
          >
        </header>
        <div
          style="
            position: absolute;
            left: 35px;
            top: 128px;
            width: 320px;
            height: 240px;
            border-radius: 6px;
            overflow: hidden;
          "
        >
          <dc-import name="DashPreview" label2="WATER" hint-size="320px,240px"></dc-import>
        </div>
        <div
          aria-hidden="true"
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
          "
        ></div>

        <section
          role="alertdialog"
          aria-labelledby="rf"
          style="
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background: #16181b;
            border-top: 1px solid #2b2f35;
            border-radius: 16px 16px 0 0;
            box-sizing: border-box;
            padding: 8px 16px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
          "
        >
          <div
            aria-hidden="true"
            style="
              align-self: center;
              width: 36px;
              height: 4px;
              border-radius: 2px;
              background: #3a3f46;
            "
          ></div>
          <div style="display: flex; gap: 12px; align-items: flex-start">
            <div
              style="
                width: 44px;
                height: 44px;
                border-radius: 22px;
                background: #2a1c0a;
                display: flex;
                align-items: center;
                justify-content: center;
                flex: none;
              "
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FF8800"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 3l10 18H2z"></path>
                <path d="M12 10v5M12 18v.5"></path>
              </svg>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <h2 id="rf" style="margin: 0; font-size: 21px; line-height: 1.25">
                The dash didn’t accept these changes
              </h2>
              <span style="font-size: 15px; color: #c9cdd2; line-height: 1.45"
                >Nothing changed on the dash. Your changes are still here.</span
              >
            </div>
          </div>

          <div
            style="
              background: #0e0f11;
              border: 1px solid #2b2f35;
              border-radius: 12px;
              padding: 14px;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          >
            <span style="font-size: 12px; color: #a0a6ad">Gauges · Street</span>
            <span style="font-size: 16px; line-height: 1.4"
              ><b>Boost</b> uses a signal your car doesn’t send.</span
            >
            <span style="font-size: 14px; color: #c9cdd2; line-height: 1.45"
              >Choose another signal or remove the gauge.</span
            >
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px">
            <button
              style="
                height: 52px;
                border-radius: 10px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 16px;
                font-weight: 600;
              "
            >
              Show me
            </button>
            <button
              style="
                height: 48px;
                border-radius: 10px;
                background: transparent;
                color: #f2f3f5;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 15px;
              "
            >
              Not now
            </button>
          </div>
        </section>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>
