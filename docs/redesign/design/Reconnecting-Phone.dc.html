<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reconnecting</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
          a {
            color: #ff6b6b;
          }
          a:hover {
            color: #ff8f8f;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          position: relative;
          overflow: hidden;
          background: #0e0f11;
          color: #f2f3f5;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        "
      >
        <header
          style="
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 56px;
            box-sizing: border-box;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2b2f35;
          "
        >
          <span
            style="
              display: inline-flex;
              align-items: center;
              gap: 8px;
              font-size: 15px;
              font-weight: 600;
              color: #ff8800;
            "
            ><svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FF8800"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"></path></svg
            >Reconnecting…</span
          >
          <button
            style="
              display: inline-flex;
              align-items: center;
              gap: 8px;
              height: 44px;
              padding: 0 14px;
              border-radius: 22px;
              background: #16181b;
              border: 1px solid #2b2f35;
              color: #f2f3f5;
              font: inherit;
              font-size: 14px;
            "
          >
            <span style="width: 8px; height: 8px; border-radius: 4px; background: #ff8800"></span>2
            changes not sent
          </button>
        </header>

        <div
          role="status"
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 56px;
            box-sizing: border-box;
            padding: 12px 16px;
            background: #2a1c0a;
            color: #ffc27a;
            font-size: 14px;
            line-height: 1.4;
            display: flex;
            gap: 10px;
            align-items: flex-start;
          "
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FF8800"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            style="flex: none; margin-top: 1px"
          >
            <path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path>
            <circle cx="12" cy="19.5" r="1"></circle>
            <path d="M3 3l18 18"></path>
          </svg>
          <span>Lost the dash’s Wi-Fi. Reconnecting… Your changes are safe in this browser.</span>
        </div>

        <main
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 124px;
            bottom: 156px;
            overflow: hidden;
            box-sizing: border-box;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
          "
        >
          <div style="display: flex; gap: 8px">
            <button
              style="
                height: 44px;
                padding: 0 16px;
                border-radius: 10px;
                background: #f2f3f5;
                color: #0e0f11;
                border: 0;
                font: inherit;
                font-size: 15px;
                font-weight: 600;
              "
            >
              Race
            </button>
            <button
              style="
                height: 44px;
                padding: 0 16px;
                border-radius: 10px;
                background: #16181b;
                color: #f2f3f5;
                border: 1px solid #2b2f35;
                font: inherit;
                font-size: 15px;
              "
            >
              Street
            </button>
            <button
              aria-label="Add page"
              style="
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                border-radius: 10px;
                background: transparent;
                color: #f2f3f5;
                border: 1px dashed #3a3f46;
              "
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 5v14M5 12h14"></path>
              </svg>
            </button>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
            <div
              style="
                width: 320px;
                height: 240px;
                border-radius: 6px;
                overflow: hidden;
                outline: 1px solid #2b2f35;
              "
            >
              <dc-import name="DashPreview" label2="WATER" hint-size="320px,240px"></dc-import>
            </div>
            <div style="font-size: 13px; color: #a0a6ad">
              Preview of your edits · live values paused
            </div>
          </div>
        </main>

        <div
          style="
            position: absolute;
            left: 0;
            right: 0;
            bottom: 84px;
            height: 72px;
            box-sizing: border-box;
            padding: 12px 16px;
            border-top: 1px solid #2b2f35;
            background: #0e0f11;
            display: flex;
            align-items: center;
            gap: 12px;
          "
        >
          <span style="flex: 1; font-size: 14px; color: #c9cdd2">2 changes in this browser</span>
          <button
            disabled
            style="
              height: 48px;
              padding: 0 16px;
              border-radius: 10px;
              background: #1e2125;
              color: #8a9097;
              border: 1px solid #2b2f35;
              font: inherit;
              font-size: 15px;
              font-weight: 600;
            "
          >
            Send when connected
          </button>
        </div>

        <nav
          style="
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 84px;
            box-sizing: border-box;
            padding-bottom: 20px;
            background: #16181b;
            border-top: 1px solid #2b2f35;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
          "
        >
          <a
            href="#"
            aria-current="page"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 4px;
              color: #f2f3f5;
              text-decoration: none;
              font-size: 12px;
              font-weight: 600;
            "
            ><svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FF4747"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect></svg
            >Gauges</a
          >
          <a
            href="#"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 4px;
              color: #a0a6ad;
              text-decoration: none;
              font-size: 12px;
            "
            ><svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 13l2-6h14l2 6v5H3z"></path>
              <circle cx="7.5" cy="15.5" r="1.5"></circle>
              <circle cx="16.5" cy="15.5" r="1.5"></circle></svg
            >Car</a
          >
          <a
            href="#"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 4px;
              color: #a0a6ad;
              text-decoration: none;
              font-size: 12px;
            "
            ><svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <path d="M8 15a4 4 0 0 1 8 0"></path>
              <path d="M12 15l2-3"></path></svg
            >Dash</a
          >
        </nav>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>
