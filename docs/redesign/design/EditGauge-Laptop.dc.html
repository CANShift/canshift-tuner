<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Edit a gauge, laptop</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <style>
          body {
            margin: 0;
          }
          a {
            color: #ff6b6b;
          }
          a:hover {
            color: #ff8f8f;
          }
        </style>
      </helmet>
      <div
        style="
          min-height: 800px;
          background: #0e0f11;
          color: #f2f3f5;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
          display: flex;
          flex-direction: column;
        "
      >
        <header
          style="
            min-height: 64px;
            box-sizing: border-box;
            padding: 10px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2b2f35;
          "
        >
          <div style="display: flex; align-items: center; gap: 20px">
            <span style="font-size: 17px; font-weight: 700">CANShift Tuner</span>
            <span
              style="
                display: inline-flex;
                align-items: center;
                gap: 8px;
                height: 32px;
                padding: 0 12px;
                border-radius: 16px;
                background: #16181b;
                border: 1px solid #2b2f35;
                font-size: 14px;
                font-weight: 600;
              "
              ><span style="width: 8px; height: 8px; border-radius: 4px; background: #3dd68c"></span
              >Connected</span
            >
          </div>
          <div style="display: flex; align-items: center; gap: 12px">
            <button
              style="
                display: inline-flex;
                align-items: center;
                gap: 8px;
                height: 44px;
                padding: 0 12px;
                border-radius: 10px;
                background: transparent;
                border: 0;
                color: #f2f3f5;
                font: inherit;
                font-size: 14px;
              "
            >
              <span style="width: 8px; height: 8px; border-radius: 4px; background: #ff8800"></span
              >1 change not sent
            </button>
            <button
              style="
                height: 44px;
                padding: 0 20px;
                border-radius: 10px;
                background: #d63333;
                color: #ffffff;
                border: 0;
                font: inherit;
                font-size: 15px;
                font-weight: 600;
              "
            >
              Send to dash
            </button>
          </div>
        </header>

        <div style="display: flex; flex-wrap: wrap; flex: 1">
          <nav
            style="
              flex: 1 1 200px;
              max-width: 100%;
              box-sizing: border-box;
              padding: 16px;
              border-right: 1px solid #2b2f35;
              display: flex;
              flex-direction: column;
              gap: 4px;
            "
          >
            <a
              href="#"
              aria-current="page"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                height: 48px;
                padding: 0 14px;
                border-radius: 10px;
                background: #1e2125;
                color: #f2f3f5;
                text-decoration: none;
                font-size: 15px;
                font-weight: 600;
              "
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FF4747"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1"></rect></svg
              >Gauges</a
            >
            <a
              href="#"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                height: 48px;
                padding: 0 14px;
                border-radius: 10px;
                color: #c9cdd2;
                text-decoration: none;
                font-size: 15px;
              "
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 13l2-6h14l2 6v5H3z"></path>
                <circle cx="7.5" cy="15.5" r="1.5"></circle>
                <circle cx="16.5" cy="15.5" r="1.5"></circle></svg
              >Car</a
            >
            <a
              href="#"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                height: 48px;
                padding: 0 14px;
                border-radius: 10px;
                color: #c9cdd2;
                text-decoration: none;
                font-size: 15px;
              "
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                <path d="M8 15a4 4 0 0 1 8 0"></path>
                <path d="M12 15l2-3"></path></svg
              >Dash</a
            >
            <a
              href="#"
              style="
                margin-top: auto;
                display: flex;
                align-items: center;
                gap: 12px;
                height: 44px;
                padding: 0 14px;
                border-radius: 10px;
                color: #a0a6ad;
                text-decoration: none;
                font-size: 14px;
              "
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17v.5"></path></svg
              >Keyboard shortcuts</a
            >
          </nav>

          <main
            style="
              flex: 999 1 560px;
              min-width: 0;
              box-sizing: border-box;
              padding: 24px 32px;
              display: flex;
              flex-wrap: wrap;
              gap: 32px;
              align-items: flex-start;
            "
          >
            <div style="display: flex; flex-direction: column; gap: 12px; max-width: 100%">
              <div style="display: flex; gap: 8px; flex-wrap: wrap">
                <button
                  style="
                    height: 44px;
                    padding: 0 16px;
                    border-radius: 10px;
                    background: #f2f3f5;
                    color: #0e0f11;
                    border: 0;
                    font: inherit;
                    font-size: 15px;
                    font-weight: 600;
                  "
                >
                  Race
                </button>
                <button
                  style="
                    height: 44px;
                    padding: 0 16px;
                    border-radius: 10px;
                    background: #16181b;
                    color: #f2f3f5;
                    border: 1px solid #2b2f35;
                    font: inherit;
                    font-size: 15px;
                  "
                >
                  Street
                </button>
                <button
                  style="
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    height: 44px;
                    padding: 0 14px;
                    border-radius: 10px;
                    background: transparent;
                    color: #f2f3f5;
                    border: 1px dashed #3a3f46;
                    font: inherit;
                    font-size: 15px;
                  "
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M12 5v14M5 12h14"></path></svg
                  >Add page
                </button>
              </div>
              <div style="position: relative; width: 640px; height: 480px; max-width: 100%">
                <div
                  style="
                    width: 640px;
                    height: 480px;
                    overflow: hidden;
                    border-radius: 8px;
                    outline: 1px solid #2b2f35;
                  "
                >
                  <div
                    style="width: 320px; height: 240px; transform: scale(2); transform-origin: 0 0"
                  >
                    <dc-import
                      name="DashPreview"
                      label2="WATER"
                      hint-size="320px,240px"
                    ></dc-import>
                  </div>
                </div>
                <div
                  aria-hidden="true"
                  style="
                    position: absolute;
                    left: 214px;
                    top: 94px;
                    width: 212px;
                    height: 192px;
                    box-sizing: border-box;
                    border: 3px solid #f2f3f5;
                    border-radius: 6px;
                  "
                ></div>
              </div>
              <div style="display: flex; gap: 8px; align-items: center">
                <button
                  style="
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    height: 44px;
                    padding: 0 14px;
                    border-radius: 10px;
                    background: #16181b;
                    color: #f2f3f5;
                    border: 1px solid #2b2f35;
                    font: inherit;
                    font-size: 15px;
                  "
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M12 5v14M5 12h14"></path></svg
                  >Add gauge
                </button>
                <span style="font-size: 14px; color: #a0a6ad">6 of 6 places used on this page</span>
              </div>
            </div>

            <section
              aria-label="Edit gauge"
              style="
                flex: 1 1 320px;
                min-width: 0;
                background: #16181b;
                border: 1px solid #2b2f35;
                border-radius: 14px;
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 16px;
              "
            >
              <div style="display: flex; flex-direction: column">
                <span style="font-size: 22px; font-weight: 700">Water</span>
                <span style="font-size: 13px; color: #a0a6ad">Gauge 2 of 6 · Race page</span>
              </div>

              <div style="display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 13px; color: #a0a6ad">Shows</span>
                <button
                  style="
                    height: 48px;
                    padding: 0 14px;
                    border-radius: 10px;
                    background: #0e0f11;
                    border: 1px solid #2b2f35;
                    color: #f2f3f5;
                    font: inherit;
                    font-size: 15px;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    text-align: left;
                  "
                >
                  <span style="flex: 1">Coolant temperature</span>
                  <span
                    style="
                      display: inline-flex;
                      align-items: center;
                      gap: 6px;
                      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
                      font-size: 14px;
                      color: #c9cdd2;
                    "
                    ><span
                      style="width: 6px; height: 6px; border-radius: 3px; background: #3dd68c"
                    ></span
                    >92 °C</span
                  >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#A0A6AD"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M6 9l6 6 6-6"></path>
                  </svg>
                </button>
              </div>

              <div style="display: flex; flex-direction: column; gap: 6px">
                <label
                  for="gname2"
                  style="
                    display: flex;
                    justify-content: space-between;
                    font-size: 13px;
                    color: #a0a6ad;
                  "
                  ><span>Name on dash</span><span>Up to 8 letters</span></label
                >
                <input
                  id="gname2"
                  value="WATER"
                  style="
                    height: 44px;
                    box-sizing: border-box;
                    padding: 0 14px;
                    border-radius: 10px;
                    background: #0e0f11;
                    border: 1px solid #2b2f35;
                    color: #f2f3f5;
                    font-size: 16px;
                    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
                  "
                />
              </div>

              <div style="display: flex; flex-direction: column; gap: 8px">
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    font-size: 13px;
                    color: #a0a6ad;
                  "
                >
                  <span>Limits</span><span>Colour this gauge only</span>
                </div>
                <div style="display: flex; align-items: center; gap: 10px">
                  <span
                    aria-hidden="true"
                    style="
                      width: 14px;
                      height: 14px;
                      border-radius: 4px;
                      border: 2px solid #ff8800;
                      box-sizing: border-box;
                    "
                  ></span>
                  <label for="w2" style="flex: 1; font-size: 15px">Warning above</label>
                  <input
                    id="w2"
                    value="105"
                    style="
                      width: 84px;
                      height: 44px;
                      box-sizing: border-box;
                      padding: 0 12px;
                      border-radius: 10px;
                      background: #0e0f11;
                      border: 1.5px solid #ff8800;
                      color: #f2f3f5;
                      font: inherit;
                      font-size: 16px;
                      text-align: right;
                    "
                  />
                  <span style="width: 24px; font-size: 14px; color: #a0a6ad">°C</span>
                </div>
                <div style="display: flex; align-items: center; gap: 10px">
                  <span
                    aria-hidden="true"
                    style="
                      width: 14px;
                      height: 14px;
                      border-radius: 4px;
                      border: 2px solid #ff4747;
                      box-sizing: border-box;
                    "
                  ></span>
                  <label for="d2" style="flex: 1; font-size: 15px">Danger above</label>
                  <input
                    id="d2"
                    value="115"
                    style="
                      width: 84px;
                      height: 44px;
                      box-sizing: border-box;
                      padding: 0 12px;
                      border-radius: 10px;
                      background: #0e0f11;
                      border: 1.5px solid #ff4747;
                      color: #f2f3f5;
                      font: inherit;
                      font-size: 16px;
                      text-align: right;
                    "
                  />
                  <span style="width: 24px; font-size: 14px; color: #a0a6ad">°C</span>
                </div>
              </div>

              <a
                href="#"
                style="
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  min-height: 48px;
                  padding: 8px 12px;
                  box-sizing: border-box;
                  border-radius: 10px;
                  background: #d63333;
                  color: #ffffff;
                  text-decoration: none;
                  font-size: 14px;
                  line-height: 1.3;
                "
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#FFFFFF"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  style="flex: none"
                >
                  <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path>
                </svg>
                <span style="flex: 1">Also triggers the full-screen alert above 120 °C</span>
                <span style="font-weight: 600; white-space: nowrap">Change in Dash ›</span>
              </a>

              <div
                style="
                  display: flex;
                  gap: 8px;
                  flex-wrap: wrap;
                  border-top: 1px solid #2b2f35;
                  padding-top: 16px;
                "
              >
                <button
                  style="
                    height: 44px;
                    padding: 0 14px;
                    border-radius: 10px;
                    background: #1e2125;
                    border: 1px solid #2b2f35;
                    color: #f2f3f5;
                    font: inherit;
                    font-size: 14px;
                  "
                >
                  Move left
                </button>
                <button
                  style="
                    height: 44px;
                    padding: 0 14px;
                    border-radius: 10px;
                    background: #1e2125;
                    border: 1px solid #2b2f35;
                    color: #f2f3f5;
                    font: inherit;
                    font-size: 14px;
                  "
                >
                  Move right
                </button>
                <button
                  style="
                    margin-left: auto;
                    height: 44px;
                    padding: 0 14px;
                    border-radius: 10px;
                    background: transparent;
                    border: 1px solid #2b2f35;
                    color: #ff6b6b;
                    font: inherit;
                    font-size: 14px;
                  "
                >
                  Remove gauge
                </button>
              </div>
            </section>
          </main>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>
