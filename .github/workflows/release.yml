name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      ARCHIVE: canshift-tuner-dash-${{ github.ref_name }}.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json $VERSION"
            exit 1
          fi

      - run: npm ci

      - name: Build the dash bundle
        run: npm run bundle:dash

      - name: Pack the archive
        run: |
          cd dist-tuner
          if find . -mindepth 1 ! -name '*.gz' | grep -q .; then
            echo "::error::dist-tuner must hold flat .gz files only"
            exit 1
          fi
          tar -czf "../$ARCHIVE" -- *.gz
          cd ..
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --draft \
            --title "Tuner $TAG" \
            --generate-notes
