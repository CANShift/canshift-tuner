name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      checks: read
    env:
      TAG: ${{ github.ref_name }}
      ARCHIVE: canshift-tuner-dash-${{ github.ref_name }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json $VERSION"
            exit 1
          fi

      - name: Tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$STATUS" != "identical" ] && [ "$STATUS" != "behind" ]; then
            echo "::error::$GITHUB_SHA is not on main (compare status: $STATUS) — tag a merged commit"
            exit 1
          fi

      - name: ci-success passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          POLL_SECONDS: 30
          POLL_ATTEMPTS: 40
        run: |
          for _ in $(seq "$POLL_ATTEMPTS"); do
            CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-success" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // "pending"')
            if [ "$CONCLUSION" = "success" ]; then
              exit 0
            fi
            if [ "$CONCLUSION" != "pending" ]; then
              echo "::error::ci-success concluded '$CONCLUSION' on $GITHUB_SHA — refusing to publish a red commit"
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done
          echo "::error::ci-success did not finish on $GITHUB_SHA in time"
          exit 1

      - run: npm ci

      - name: Build the dash bundle
        run: npm run bundle:dash

      - name: Pack the archive
        run: |
          cd dist-tuner
          if find . -mindepth 1 ! -name '*.gz' | grep -q .; then
            echo "::error::dist-tuner must hold flat .gz files only"
            exit 1
          fi
          tar -czf "../$ARCHIVE" -- *.gz
          cd ..
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --draft \
            --title "Tuner $TAG" \
            --generate-notes
